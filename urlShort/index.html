<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URLShort - 스마트 URL 단축기</title>
  <meta name="description" content="복잡하고 긴 웹 주소를 깔끔하고 짧은 링크로 단축하세요. OpenAPI 기반 실시간 URL 단축 및 원클릭 복사 지원.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 배경 앰비언트 글로우 장식 -->
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>
  <div class="ambient-glow glow-3"></div>

  <!-- 상단 네비게이션 헤더 -->
  <header class="app-header">
    <div class="header-inner">
      <a href="../index.html" class="logo-link" title="메인 홈으로 이동">
        <div class="logo-icon-badge">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
          </svg>
        </div>
        <span class="logo-text">URLShort <span class="logo-badge">STUDIO</span></span>
      </a>

      <!-- 글로벌 서비스 전환 네비게이션 탭 -->
      <nav class="nav-button-group" aria-label="서비스 전환 메뉴">
        <a href="../url2qr/index.html" class="nav-tab-btn" id="nav-btn-qr" title="QR코드 생성기로 이동">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
          </svg>
          <span>QR코드</span>
        </a>
        <a href="index.html" class="nav-tab-btn active" id="nav-btn-short" title="현재 서비스: URL 단축">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
          </svg>
          <span>URL단축</span>
        </a>
      </nav>
    </div>
  </header>

  <!-- 메인 뷰포트 컨테이너 -->
  <main class="main-container">
    <div class="shortener-wrapper">
      
      <!-- 인트로 헤드라인 -->
      <div class="intro-headline">
        <div class="pill-tag">
          <span class="pill-pulse"></span>
          <span>OpenAPI Link Shortener</span>
        </div>
        <h1 class="main-heading">
          긴 웹 주소를 간결하게 줄이고<br>
          <span class="highlight-text">스마트한 단축 링크</span>를 만드세요
        </h1>
        <p class="sub-heading">
          원하는 웹 사이트 주소를 입력하면 OpenAPI를 통해 즉시 짧은 링크로 단축되며,<br>
          단 한 번의 클릭으로 클립보드에 복사할 수 있습니다.
        </p>
      </div>

      <!-- URL 입력 및 단축 컨트롤 카드 -->
      <section class="card-glass-panel">
        <form class="shorten-form" id="shorten-form" onsubmit="return false;">
          
          <div class="form-group">
            <label for="url-input" class="input-label">단축할 원본 URL 입력</label>
            <div class="input-box-wrapper">
              <div class="input-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                  <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
                </svg>
              </div>

              <!-- 3-1: URL 입력창 -->
              <input 
                type="text" 
                id="url-input" 
                class="url-input-field" 
                placeholder="https:// 줄이고 싶은 긴 URL을 입력하세요 (예: https://example.com/very/long/path)" 
                autocomplete="off" 
                spellcheck="false"
              >

              <!-- 입력 제어 도구 (지우기 / 붙여넣기) -->
              <div class="input-tools">
                <button type="button" class="tool-btn" id="btn-clear" title="내용 지우기" aria-label="입력 내용 지우기">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                  </svg>
                </button>
                <button type="button" class="tool-btn" id="btn-paste" title="클립보드 붙여넣기" aria-label="클립보드 내용 붙여넣기">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
                    <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
                  </svg>
                </button>
              </div>

              <!-- 3-1 & 3-2: 단축하기 버튼 (입력 필드가 비어있으면 disabled) -->
              <button type="submit" class="shorten-submit-btn" id="btn-shorten" disabled title="단축할 URL을 먼저 입력해주세요">
                <span class="btn-spinner" id="btn-spinner" aria-hidden="true"></span>
                <span class="btn-text" id="btn-text">단축하기</span>
                <svg class="btn-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="13 17 18 12 13 7"></polyline>
                  <polyline points="6 17 11 12 6 7"></polyline>
                </svg>
              </button>
            </div>
            
            <p class="field-hint" id="field-hint">
              <span class="hint-dot"></span>
              웹 주소를 입력하면 '단축하기' 버튼이 활성화됩니다.
            </p>
          </div>

          <!-- 3-1 & 3-3: 읽기 전용 출력 상자 및 복사 섹션 -->
          <div class="result-container" id="result-container">
            <div class="divider-line">
              <span class="divider-badge">단축 결과</span>
            </div>

            <div class="form-group">
              <div class="result-header">
                <label for="output-url" class="input-label">생성된 단축 URL (읽기 전용)</label>
                <span class="status-indicator" id="status-indicator">
                  <span class="status-dot"></span>
                  <span id="status-text">단축 완료</span>
                </span>
              </div>

              <div class="output-box-wrapper">
                <div class="output-icon">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"></polyline>
                  </svg>
                </div>

                <!-- 3-1: 읽기 전용 출력 상자 -->
                <input 
                  type="text" 
                  id="output-url" 
                  class="url-output-field" 
                  readonly 
                  placeholder="단축하기를 누르면 이곳에 결과 URL이 표시됩니다"
                  title="단축된 URL (읽기 전용)"
                >

                <!-- 3-4: 복사 버튼 -->
                <button type="button" class="copy-action-btn" id="btn-copy" title="단축 URL 클립보드 복사">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                  </svg>
                  <span>복사</span>
                </button>
              </div>

              <!-- 보조 액션 버튼들 (페이지 열기, QR코드 생성 연동) -->
              <div class="result-actions" id="result-actions">
                <button type="button" class="secondary-btn" id="btn-visit-short" title="새 창에서 단축 링크 열기">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                    <polyline points="15 3 21 3 21 9"></polyline>
                    <line x1="10" y1="14" x2="21" y2="3"></line>
                  </svg>
                  <span>링크 열기</span>
                </button>
                <button type="button" class="secondary-btn highlight-secondary" id="btn-create-qr" title="단축 URL로 QR코드 즉시 생성">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="7" height="7"></rect>
                    <rect x="14" y="3" width="7" height="7"></rect>
                    <rect x="14" y="14" width="7" height="7"></rect>
                    <rect x="3" y="14" width="7" height="7"></rect>
                  </svg>
                  <span>QR코드로 변환하기</span>
                </button>
              </div>
            </div>
          </div>

        </form>

        <!-- 빠른 테스트 예시 샘플 -->
        <div class="quick-samples" id="quick-samples">
          <span class="sample-label">테스트용 긴 주소 예시:</span>
          <button type="button" class="sample-tag" data-url="https://github.com/torvalds/linux/blob/master/README">Linux Readme</button>
          <button type="button" class="sample-tag" data-url="https://developer.mozilla.org/ko/docs/Web/JavaScript/Reference/Global_Objects/Promise">MDN Promise</button>
          <button type="button" class="sample-tag" data-url="https://www.google.com/search?q=open+api+url+shortener">Google Search</button>
        </div>
      </section>

      <!-- 최근 단축 기록 섹션 -->
      <section class="history-section" id="history-section">
        <div class="history-header">
          <div class="history-title">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            <span>최근 단축 기록</span>
          </div>
          <button type="button" class="history-clear-btn" id="btn-clear-history" title="기록 지우기">전체 삭제</button>
        </div>
        <div class="history-list" id="history-list">
          <div class="history-empty">아직 단축한 링크 기록이 없습니다.</div>
        </div>
      </section>

    </div>
  </main>

  <!-- 3-4: '복사하였습니다' 토스트 알림창 -->
  <div class="toast-notification" id="toast" role="alert" aria-live="assertive">
    <div class="toast-icon" id="toast-icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>
    <span class="toast-message" id="toast-message">복사하였습니다</span>
  </div>

  <script src="script.js"></script>
</body>
</html>
